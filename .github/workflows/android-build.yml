name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Java (for Android build)
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Vendors
        run: pnpm --filter @dod/dod-app setup-vendors

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Init Tauri Android
        working-directory: apps/readest-app
        run: |
          rm -rf src-tauri/gen
          pnpm tauri android init
          
          echo "--- BEFORE ---"
          cat src-tauri/gen/android/app/build.gradle.kts
          
          node -e "
          const fs = require('fs');
          const path = 'src-tauri/gen/android/app/build.gradle.kts';
          let content = fs.readFileSync(path, 'utf8');
          const injection = \`
              flavorDimensions += \\\"store\\\"
              productFlavors {
                  create(\\\"foss\\\") {
                      dimension = \\\"store\\\"
                  }
              }
          \`;
          content = content.replace('defaultConfig {', injection + '\\n    defaultConfig {\\n        missingDimensionStrategy(\\\"store\\\", \\\"foss\\\")');
          fs.writeFileSync(path, content);
          "
          
          echo "--- AFTER ---"
          cat src-tauri/gen/android/app/build.gradle.kts

      - name: Build Tauri Android APK
        working-directory: apps/readest-app
        run: pnpm tauri android build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dod-android-apk
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
